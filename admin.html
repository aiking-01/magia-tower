<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>プレイ情報の集計｜マギア・タワー</title>
  <style>
    :root { --bg: #0c1030; --panel: #151a44; --text: #e8ebff; --dim: #a8afd8; --accent: #8ff3ff; --gold: #e0b84a; --line: #2b3364; --bad: #ff7a7a; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.7 "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 20px; letter-spacing: 2px; margin: 4px 0 12px; }
    h2 { font-size: 16px; color: var(--accent); margin: 26px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); padding: 10px; border-radius: 8px; }
    input { background: #0a0e28; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; min-width: 0; flex: 1 1 220px; }
    button { background: #26306e; color: var(--text); border: 1px solid #3a4590; border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .card .k { font-size: 12px; color: var(--dim); }
    .card .v { font-size: 22px; font-weight: 800; color: var(--gold); }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { background: var(--panel); }
    .dim { color: var(--dim); font-size: 12px; }
    .err { color: var(--bad); }
    .barcell { display: inline-block; height: 8px; background: var(--accent); border-radius: 4px; vertical-align: middle; margin-left: 6px; }
  </style>
</head>
<body>
<main>
  <h1>プレイ情報の集計</h1>
  <div class="bar">
    <input type="password" id="token" placeholder="合言葉（Vercel の環境変数 ADMIN_TOKEN）" autocomplete="off">
    <button id="load">表示</button>
    <button id="fresh">最新に更新</button>
    <input type="text" id="month" placeholder="書き出す月（例 202610）" style="flex:0 1 180px">
    <button id="export">生データを書き出す</button>
  </div>
  <p class="dim" id="status">合言葉を入れて「表示」を押してください。集計は5分ごとに作り直されます（「最新に更新」ですぐ作り直す）。</p>
  <div id="out"></div>
</main>
<script>
  // everything that comes back is data written by players' devices: always inserted as text (esc), never as HTML
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (id) => document.getElementById(id);
  try { $("token").value = sessionStorage.getItem("mtAdminToken") || ""; } catch (e) { /* private mode */ }
  async function call(query) {
    const token = $("token").value.trim();
    try { sessionStorage.setItem("mtAdminToken", token); } catch (e) { /* ignore */ }
    const r = await fetch("api/admin?" + query, { headers: { authorization: "Bearer " + token } });
    if (r.status === 401) throw new Error("合言葉が違います");
    if (r.status === 429) throw new Error("失敗が多すぎます。明日もう一度試してください");
    if (r.status === 503) throw new Error("データベースが未接続か、無料枠を使い切っています");
    if (!r.ok) throw new Error("エラー " + r.status);
    return r.json();
  }
  const q = (o) => (o && o.n ? `${esc(o.median)}<span class="dim">（25%: ${esc(o.p25)} / 75%: ${esc(o.p75)} / n=${esc(o.n)}）</span>` : `<span class="dim">データなし</span>`);
  const card = (k, v) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;
  function table(head, rows) {
    return `<div class="scroll"><table><tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
  }
  function render(s) {
    const maxDefeat = Math.max(1, ...s.defeatsByFloor.map((d) => d[1]));
    const html = [
      `<p class="dim">${esc(new Date(s.generatedAt).toLocaleString("ja-JP"))} 時点・対象 ${esc(s.months.join(", "))}・${esc(s.batches)} 回分の送信</p>`,
      `<div class="cards">${card("プレイヤー（匿名ID）", esc(s.players))}${card("起動回数", esc(s.sessions))}${card("オート中心のラン", esc(Math.round(s.autoRunShare * 100)) + "%")}${card("スマホ / PC", esc(s.devices.sp || 0) + " / " + esc(s.devices.pc || 0))}</div>`,
      `<h2>ラスボス初撃破まで</h2>`,
      table(["", "中央値"], [["プレイ時間（分）", q(s.firstClearMinutes)], ["挑戦回数", q(s.firstClearRuns)]]),
      `<h2>節目の階に初めて届くまでのプレイ時間（分）</h2>`,
      table(["階", "中央値"], Object.entries(s.milestoneMinutes).map(([f, v]) => [esc(f) + "階", q(v)])),
      `<h2>負けた階（多い順）</h2>`,
      table(["階", "回数"], s.defeatsByFloor.map(([f, n]) => [esc(f), `${esc(n)}<span class="barcell" style="width:${Math.round((n / maxDefeat) * 160)}px"></span>`])),
      `<h2>1回の挑戦</h2>`,
      table(["", "中央値"], [["かかった秒数", q(s.runSeconds)], ["使ったカード", q(s.runCards)]]),
      table(["終わり方", "回数"], Object.entries(s.runEndCauses).map(([k, v]) => [esc({ defeat: "敗北", retreat: "撤退", stuck: "打つ手がない" }[k] || k), esc(v)])),
      `<h2>転生</h2>`,
      table(["", "中央値"], [["転生したレベル", q(s.reincarnation.level)], ["その時のプレイ時間（分）", q(s.reincarnation.playMinutes)]]),
      `<h2>苦難</h2>`,
      table(["苦難", "挑戦", "達成", "放棄"], Object.entries(s.trials).sort().map(([id, v]) => [esc(id), esc(v.start || 0), esc(v.clear || 0), esc(v.abandon || 0)])),
      `<h2>手に入れた秘宝</h2>`,
      table(["秘宝", "回数"], Object.entries(s.items).sort((a, b) => b[1] - a[1]).map(([id, n]) => [esc(id), esc(n)])),
      `<h2>版ごとのプレイヤー</h2>`,
      table(["版", "人数"], Object.entries(s.versions).map(([v, n]) => [esc(v), esc(n)])),
    ].join("");
    $("out").innerHTML = html;
  }
  async function load(fresh) {
    $("status").textContent = "読み込み中…";
    $("status").className = "dim";
    try {
      render(await call("op=stats" + (fresh ? "&fresh=1" : "")));
      $("status").textContent = "表示しました。";
    } catch (e) { $("status").textContent = e.message; $("status").className = "err"; }
  }
  $("load").onclick = () => load(false);
  $("fresh").onclick = () => load(true);
  $("export").onclick = async () => {
    const month = $("month").value.trim() || new Date().toISOString().slice(0, 7).replace("-", "");
    try {
      let rows = [];
      for (let offset = 0; ; offset += 1000) {
        const r = await call(`op=export&month=${encodeURIComponent(month)}&offset=${offset}&limit=1000`);
        rows = rows.concat(r.rows);
        if (offset + 1000 >= r.total) break;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(rows, null, 1)], { type: "application/json" }));
      a.download = `magia-tower-playdata-${month}.json`;
      a.click();
      $("status").textContent = `${rows.length} 件を書き出しました。`;
    } catch (e) { $("status").textContent = e.message; $("status").className = "err"; }
  };
</script>
</body>
</html>
